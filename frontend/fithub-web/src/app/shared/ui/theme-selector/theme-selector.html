<fieldset>
  <legend><fit-app-icon name="palette" /> Theme preference</legend>
  <p id="theme-selector-help">Choose the appearance that is most comfortable for you.</p>
  <div class="theme-options" role="radiogroup" aria-describedby="theme-selector-help">
    @for (option of options; track option.id) {
      <label [class.selected]="themes.theme() === option.id">
        <input
          type="radio"
          name="fithub-theme"
          [value]="option.id"
          [checked]="themes.theme() === option.id"
          (change)="select(option.id)"
        />
        <span class="theme-copy">
          <strong>{{ option.name }}</strong>
          <small>{{ option.description }}</small>
        </span>
        <span class="selected-indicator">
          @if (themes.theme() === option.id) { <fit-app-icon name="check" label="Selected" /> }
        </span>
      </label>
    }
  </div>
</fieldset>
