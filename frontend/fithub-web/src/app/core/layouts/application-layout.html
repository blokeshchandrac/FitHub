<div class="app-shell">
  <header>
    <button class="menu-button" type="button" (click)="navigationOpen.update(open => !open)"
      aria-label="Toggle navigation" [attr.aria-expanded]="navigationOpen()">
      <span></span><span></span><span></span>
    </button>
    <a class="brand" [routerLink]="homePath()"><span class="brand-mark">FH</span><span>FitHub</span></a>
    @if (authentication.currentUser(); as user) {
      <div class="header-actions">
        @if (isAdministrator()) {
          <a
            class="virtual-lab-action"
            href="/simulation"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open Virtual Lab in a new tab"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M9 3h6M10 3v5.2L5.5 16a3.3 3.3 0 0 0 2.9 5h7.2a3.3 3.3 0 0 0 2.9-5L14 8.2V3M8 14h8" />
            </svg>
            <span class="virtual-lab-label">Virtual Lab</span>
          </a>
        }
        <span class="status-dot" aria-hidden="true"></span>
        <span>{{ user.firstName }} · {{ user.roles.join(', ') }}</span>
        <button type="button" (click)="logout()">Sign out</button>
      </div>
    }
  </header>
  <aside [class.open]="navigationOpen()">
    <nav aria-label="Primary navigation">
      @for (item of navigationItems; track item.path) {
        @if (hasAnyRole(item.roles)) {
          <a [routerLink]="item.path" routerLinkActive="active" (click)="navigationOpen.set(false)">
            <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>{{ item.label }}
          </a>
        }
      }
    </nav>
  </aside>
  <main id="main-content"><router-outlet /></main>
</div>
