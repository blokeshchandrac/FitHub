<section class="feature-page narrow-page"><p class="eyebrow">Trainer tools</p><h1>Assign workout plans</h1><form class="foundation-card form-stack" [formGroup]="form" (ngSubmit)="assign()"><label for="assignment-template">Template</label><select id="assignment-template" formControlName="templateId"><option value="">Choose a template</option>@for (template of templates(); track template.id) { <option [value]="template.id">{{ template.name }}</option> }</select><label for="assignment-member">Member</label><select id="assignment-member" formControlName="memberUserId"><option value="">Choose a member</option>@for (member of members(); track member.id) { <option [value]="member.id">{{ member.firstName }} {{ member.lastName }} · {{ member.email }}</option> }</select>@if (message()) { <div class="success-message">{{ message() }}</div> }@if (error()) { <div class="api-error">{{ error() }}</div> }<button class="primary-button" type="submit">Assign plan</button></form></section>
