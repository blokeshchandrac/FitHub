<section class="feature-page"><p class="eyebrow">Training reference</p><h1>Exercise library</h1><form class="foundation-card filter-row" [formGroup]="filters" (ngSubmit)="search()"><input aria-label="Search exercises" placeholder="Search name or instructions" formControlName="search"><input aria-label="Filter muscle group" placeholder="Muscle group" formControlName="muscleGroup"><input aria-label="Filter equipment" placeholder="Equipment" formControlName="equipment"><button class="primary-button" type="submit">Search</button></form><div class="card-grid">@for (exercise of exercises(); track exercise.id) { <article class="foundation-card"><p class="eyebrow">{{ exercise.muscleGroup }}</p><h2>{{ exercise.name }}</h2><p><strong>Equipment:</strong> {{ exercise.equipment || 'None' }}</p><p>{{ exercise.instructions }}</p></article> } @empty { <div class="foundation-card">No exercises match these filters.</div> }</div></section>
