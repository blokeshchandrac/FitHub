<section class="feature-page"><p class="eyebrow">Workout builder</p><h1>{{ templateId ? 'Edit template' : 'Create template' }}</h1><form class="foundation-card form-stack" [formGroup]="form" (ngSubmit)="save()"><label for="template-name">Name</label><input id="template-name" formControlName="name"><label for="template-description">Description</label><textarea id="template-description" formControlName="description"></textarea><label class="checkbox-row"><input type="checkbox" formControlName="isPublic"> Share with other members</label><fieldset><legend>Exercises</legend><div class="selection-grid">@for (exercise of exercises(); track exercise.id) { <label class="select-card" [class.selected]="selected().has(exercise.id)"><input type="checkbox" [checked]="selected().has(exercise.id)" (change)="toggle(exercise.id)"><span><strong>{{ exercise.name }}</strong><small>{{ exercise.muscleGroup }} · {{ exercise.equipment || 'No equipment' }}</small></span></label> }</div></fieldset>@if (error()) { <div class="api-error">{{ error() }}</div> }<button class="primary-button" type="submit">Save template</button></form></section>
