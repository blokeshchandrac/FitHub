<section class="feature-page narrow-page"><h1>Notifications</h1><p>Membership, class, workout, streak, record and fault-report updates.</p>@if(error()){<p class="api-error">{{error()}}</p>}<div class="notification-list">@for(item of items();track item.id){<article [class]="'foundation-card notification-card '+(item.isRead?'read':'unread')"><div><span class="status-badge">{{item.type}}</span><h2>{{item.title}}</h2><p>{{item.message}}</p><small>{{item.createdAt}}</small></div>@if(!item.isRead){<button class="secondary-button" (click)="read(item.id)">Mark read</button>}</article>}@empty{<div class="foundation-card">No notifications.</div>}</div></section>
