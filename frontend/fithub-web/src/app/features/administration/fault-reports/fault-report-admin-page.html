<section class="feature-page"><h1>Fault administration</h1><p>Review, schedule and resolve equipment reports.</p>@if(error()){<p class="api-error">{{error()}}</p>}@for(report of reports();track report.id){<div class="foundation-card"><div class="page-heading"><h2>{{report.equipmentName}} · {{report.category}}</h2><span class="status-badge">{{report.status}}</span></div><p>{{report.comment||'No comment'}}</p><div class="form-stack"><select #status><option>Open</option><option>UnderReview</option><option>Scheduled</option><option>Resolved</option><option>Rejected</option></select><textarea #notes placeholder="Required maintenance notes"></textarea><button class="primary-button" (click)="update(report.id,status.value,notes.value)">Update</button></div></div>}@empty{<div class="foundation-card">No fault reports.</div>}</section>
