name: fithub

services:
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/src/FitHub.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__FitHubDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      SeedData__Enabled: "true"
      SeedData__DemoPassword: ${DEMO_SEED_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      Stripe__WebBaseUrl: ${FRONTEND_BASE_URL}
      Stripe__CheckoutSuccessUrl: ${STRIPE_CHECKOUT_SUCCESS_URL}
      Stripe__CheckoutCancelUrl: ${STRIPE_CHECKOUT_CANCEL_URL}
      PasswordReset__ExpiryMinutes: ${PASSWORD_RESET_EXPIRY_MINUTES:-30}
      PasswordReset__FrontendBaseUrl: ${FRONTEND_BASE_URL}
      Email__Provider: Smtp
      Email__SmtpHost: mailpit
      Email__SmtpPort: 1025
      Email__UseTls: "false"
      Email__SenderAddress: ${SMTP_SENDER_ADDRESS:-no-reply@fithub.local}
      Email__SenderName: ${SMTP_SENDER_NAME:-FitHub}
      EquipmentDevices__CardUidPepper: ${EQUIPMENT_CARD_UID_PEPPER}
      SeedData__EquipmentDeviceCredential: ${EQUIPMENT_DEVICE_CREDENTIAL}
      SeedData__MemberCardUid: ${EQUIPMENT_MEMBER_CARD_UID}
      SeedData__ParkingCameraCredential: ${PARKING_CAMERA_CREDENTIAL}
      Simulation__Enabled: ${SIMULATION_ENABLED:-true}
      Simulation__ClearanceSeconds: ${SIMULATION_CLEARANCE_SECONDS:-30}
      Simulation__ParkingScanSeconds: ${SIMULATION_PARKING_SCAN_SECONDS:-60}
      Simulation__ParkingDemoScanSeconds: ${SIMULATION_PARKING_DEMO_SCAN_SECONDS:-5}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: frontend/fithub-web
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-4040}:80"
    depends_on:
      - api

volumes:
  postgres-data:
