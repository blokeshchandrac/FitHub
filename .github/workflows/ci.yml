name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/FitHub.sln
      - run: dotnet build backend/FitHub.sln --configuration Release --no-restore
      - run: dotnet test backend/FitHub.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/fithub-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/fithub-web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - name: Build production frontend with hosted runtime configuration
        run: npm run build:render
        env:
          PUBLIC_API_BASE_URL: https://fithub-api-10252426.onrender.com
      - name: Audit shipped production dependencies
        run: npm audit --omit=dev
      - name: Report complete dependency audit
        continue-on-error: true
        run: npm audit

  simulators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - run: npm test
        working-directory: simulators/equipment-simulator
      - run: npm test
        working-directory: simulators/parking-simulator

  dotnet-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/FitHub.sln
      - run: dotnet list backend/FitHub.sln package --vulnerable --include-transitive

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config
      - run: docker compose --env-file .env.example build
